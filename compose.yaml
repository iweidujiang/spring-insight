# Spring Insight Server — 一键起监测中心（Docker 首选）
#
# 用法：
#   docker compose up -d
# 浏览器：http://localhost:9966/
# 告警 / AI 等在控制台「设置」页配置（持久化到挂卷内 runtime-settings.json）。
#
# 默认拉取 GHCR 已发布镜像；本地改代码时可改为 build

name: spring-insight

services:
  insight-server:
    image: ${INSIGHT_SERVER_IMAGE:-ghcr.io/iweidujiang/spring-insight-server:0.4.0}
    # 本地从源码构建时改为：
    # build:
    #   context: .
    #   dockerfile: insight-server/Dockerfile
    # image: spring-insight-server:local
    container_name: spring-insight-server
    ports:
      - "${INSIGHT_HOST_PORT:-9966}:9966"
    environment:
      # memory | file | sqlite
      SPRING_INSIGHT_SERVER_STORAGE_MODE: ${INSIGHT_STORAGE_MODE:-file}
      SPRING_INSIGHT_SERVER_STORAGE_FILE_PATH: /data/spans.json
      SPRING_INSIGHT_SERVER_STORAGE_FLUSH_DELAY_MS: "2000"
      SPRING_INSIGHT_SERVER_STORAGE_SQLITE_PATH: /data/insight.db
      SPRING_INSIGHT_SERVER_STORAGE_RETENTION_MAX_AGE_HOURS: ${INSIGHT_RETENTION_HOURS:-0}
      # 控制台登录默认关。打开示例：INSIGHT_UI_AUTH_ENABLED=true INSIGHT_UI_PASSWORD=insight
      SPRING_INSIGHT_SERVER_SECURITY_UI_AUTH_ENABLED: ${INSIGHT_UI_AUTH_ENABLED:-false}
      SPRING_INSIGHT_SERVER_SECURITY_UI_USERNAME: ${INSIGHT_UI_USERNAME:-admin}
      SPRING_INSIGHT_SERVER_SECURITY_UI_PASSWORD: ${INSIGHT_UI_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - insight-spans:/data
    restart: unless-stopped

volumes:
  insight-spans:
