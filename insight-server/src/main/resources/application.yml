# Spring Insight Server —— 独立监测中心
spring:
  application:
    name: spring-insight-server
  insight:
    server:
      storage:
        # memory（默认，重启清空）| file（JSON 落盘）| sqlite（DB 落盘，需显式开启）
        mode: memory
        max-spans: 50000
        file-path: ./data/spans.json
        flush-delay-ms: 2000
        retention:
          # 0 = 不按时间裁；例如 72 表示只保留最近 72 小时
          max-age-hours: 0
          vacuum-interval-ms: 60000
        sqlite:
          path: ./data/insight.db
      security:
        # 默认关闭：与 0.1 接入兼容。开启后 Agent 须配置 spring.insight.ingest-token
        ingest-token-required: false
        ingest-token: ""
        # 控制台 UI API 简易登录（默认关）；开启后须配置 ui-password
        ui-auth-enabled: false
        ui-username: admin
        ui-password: ""
        ui-session-ttl-hours: 24

server:
  port: 9966

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    io.github.iweidujiang.springinsight: INFO
