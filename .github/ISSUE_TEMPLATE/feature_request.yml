name: 功能建议
description: 新能力或体验改进（请说明用户场景）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请描述**使用者能感知到的**能力，避免只写实现手段。若与现有 Issue 重复，请先评论跟帖。
  - type: dropdown
    id: area
    attributes:
      label: 主要落点
      description: 可多选；不确定可勾「不确定」
      multiple: true
      options:
        - Agent / Starter
        - Server
        - 控制台 UI
        - 文档 / 示例 / 运维
        - 不确定
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 当前痛点或缺失场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 理想中用户如何操作、看到什么
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 可选；例如其它工具或临时workaround
    validations:
      required: false
  - type: dropdown
    id: priority_hint
    attributes:
      label: 对你的紧急程度（参考）
      options:
        - 阻塞日常排查
        - 明显提升效率
        - 锦上添花
      default: 1
    validations:
      required: false
