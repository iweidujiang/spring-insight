# Spring Insight 持续集成（2.7.x）
# - JDK 11 下 verify 本分支 Agent / Starter（字节码目标 Java 8）

name: CI

on:
  push:
    branches: ["2.7.x"]
  pull_request:
    branches: ["2.7.x"]

jobs:
  boot27:
    name: Boot 2.7 Agent（JDK 11）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: 构建并测试
        run: mvn -B -ntp verify
      - name: 确认 Agent 字节码为 Java 8（major 52）
        run: |
          CLASS=$(find insight-agent-boot2/target/classes -name '*.class' | head -n 1)
          test -n "$CLASS"
          MAJOR=$(javap -verbose "$CLASS" | awk '/major version:/{print $3; exit}')
          echo "$(basename "$CLASS") major version=$MAJOR (expect 52)"
          test "$MAJOR" = "52"
