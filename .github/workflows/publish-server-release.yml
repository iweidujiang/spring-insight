# 推送版本 tag（vX.Y.Z，不含 boot2）时：
# 1) 构建 insight-server 可执行 fat jar
# 2) 创建/更新 GitHub Release，并挂载 insight-server-X.Y.Z.jar
#
# 与 Publish Server Image（GHCR）并行；无 Docker 用户可从 Release Assets 下载后：
#   java -jar insight-server-X.Y.Z.jar   （需 JDK 17+）

name: Publish Server Release Jar

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 git tag（如 v0.3.2），用于补发 jar"
        required: true

permissions:
  contents: write

jobs:
  release-jar:
    name: 构建并挂载 Server jar
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.ref_name, 'boot2'))
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          VER="${REF#v}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "asset=insight-server-${VER}.jar" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 打包 insight-server（含控制台 UI）
        run: mvn -B -ntp -pl insight-server -am clean package -DskipTests

      - name: 准备 Release 资产
        shell: bash
        run: |
          mkdir -p dist
          SRC=insight-server/target/insight-server.jar
          test -f "$SRC"
          cp "$SRC" "dist/${{ steps.ver.outputs.asset }}"
          ls -lh dist/

      - name: 创建/更新 GitHub Release 并上传 jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: v${{ steps.ver.outputs.version }}
          # 若 Release 尚无正文，先用自动生成说明；你可随后在网页改成 CHANGELOG 文案
          generate_release_notes: true
          files: dist/${{ steps.ver.outputs.asset }}
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
